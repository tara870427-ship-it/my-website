name: 更新房市新聞

on:
  schedule:
    # 台灣時間 08:00 和 18:00(GitHub 用 UTC 時間)
    - cron: '0 0,10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓新聞
        run: node scripts/fetch-news.mjs
      - name: 有變動才上傳
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "新聞沒有變動"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "自動更新房市新聞"
          git push
